[sources]
# VENDORED in-tree at vendor/NestedSamplers — the jvines fork of NestedSamplers.jl
# @ fix/high-dim-stability (commit 64b0ff7), carrying Bounds.MLFriends +
# Proposals.HSlice that src/samplers/nested.jl uses (bounds=:mlfriends,
# proposal=:hslice). Self-contained + portable (no sibling clone / external git
# pin); upstream (TuringLang) is unmaintained. See vendor/NestedSamplers/VENDORED.md.
NestedSamplers = {path = "vendor/NestedSamplers"}

