# Not imported anywhere — a direct dep ONLY to carry this compat bound.
# OptimizationOptimJL 0.4.18 calls OptimizationBase.supports_sense (added in
# OptimizationBase 5.1) while relaxing its own declared compat from
# "5.1.0 - 5" back to "5", so the registry permits the broken pair
# 0.4.18 + OptimizationBase 5.0.0 — and a fresh `Pkg.add(url=...)` resolves
# exactly there and `using Nereus` dies inside Pathfinder's precompile. Our dev
# Manifest never sees it (pinned at 0.4.10 from before the call existed), which
# is why the package worked here and failed for a clean install. 0.4.19 keeps
# the bad bound, hence the upper cap. Drop this dep+bound when upstream
# publishes a version requiring OptimizationBase >= 5.1 again.
OptimizationOptimJL = "0.4.10 - 0.4.17"
